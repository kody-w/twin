# Static Data Covenant (RAR CONSTITUTION.md Article XXIV): vbrainstem.html's
# Summon flow used to list agents/ via a live api.github.com call. It now
# reads agents/index.json, a committed snapshot this workflow refreshes
# whenever the agents/ directory changes.
name: Refresh agents index

on:
  push:
    branches: [main]
    # Excludes agents/index.json itself so the harvest commit below doesn't
    # retrigger this workflow.
    paths: ['agents/*.py', 'scripts/harvest-agents-index.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agents-index
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Harvest agents/ listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/harvest-agents-index.mjs kody-w/twin agents
      - name: Commit updated index
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add agents/index.json
          if git diff --cached --quiet; then
            echo "no index changes"
            exit 0
          fi
          git commit -m "agents: refresh index.json"
          git push origin HEAD:main
